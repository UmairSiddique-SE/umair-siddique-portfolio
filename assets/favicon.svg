<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#090a10" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Dev Icon / Monogram US -->
  <path d="M16 24 L8 32 L16 40" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M48 24 L56 32 L48 40" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="32" y="38" font-family="'JetBrains Mono', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">US</text>
</svg>
