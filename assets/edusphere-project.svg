<rect x="830" y="215" width="250" height="130" rx="20" fill="#172554"/><text x="855" y="250" fill="#93c5fd" font-family="Arial,sans-serif" font-size="16">Fee Collection</text><text x="855" y="305" fill="white" font-family="Arial,sans-serif" font-size="38" font-weight="700">82%</text>
