  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
</defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/>
<rect x="55" y="55" width="1090" height="590" rx="28" fill="#0b1020" stroke="#ffffff" stroke-opacity=".12"/>
